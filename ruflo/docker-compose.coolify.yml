# N3XUS Flow — stack para o Coolify (VM 520).
# Coolify: Build Pack "Docker Compose", Base Directory /ruflo,
# arquivo /docker-compose.coolify.yml; domínio só no serviço "nginx", COM a porta:
# https://flow.n3xus.dev:3000 (a imagem nginx expõe 80 e 3000; sem a porta o
# Traefik escolhe 80 e responde 502).
#
# Diferenças em relação ao docker-compose.yml do upstream:
# - nenhuma porta publicada no host (o Traefik do Coolify fala com o nginx);
# - a ponte MCP escuta em 0.0.0.0 dentro da rede da stack, com token
#   obrigatório (no upstream ela escuta em 127.0.0.1 e o chat-ui não alcança);
# - segredos gerados pelo Coolify (SERVICE_PASSWORD_*), nada no repositório;
# - sem MongoDB: o chat-ui deste fork grava num arquivo RVF (JSON) em /app/db,
#   que ganhou volume (no upstream ficava no contêiner e sumia a cada deploy);
# - memória da ponte (.claude-flow) em volume persistente;
# - limites de memória em todos os serviços.
#
# Chaves de LLM (pelo menos uma) vão nas variáveis do Coolify:
# GOOGLE_API_KEY, ANTHROPIC_API_KEY, OPENROUTER_API_KEY ou LLM_OPENAI_API_KEY (não OPENAI_API_KEY:
# o Coolify injeta todas as variáveis em todos os serviços, e no chat-ui esse
# nome é o token da ponte).

services:
  mcp-bridge:
    build:
      context: ./src/ruvocal/mcp-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Só para chave Anthropic sem workspace (a API exige o cabeçalho).
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      # Cloudflare Workers AI (token com permissão Workers AI; não treina com os dados).
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-35f8be2ffd8ab7bde84c9379dd89dbda}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      # Z.ai (só os modelos glm-*-flash, grátis) e Ollama Cloud.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Extras do OpenRouter além dos ":free" com ferramentas (ids separados por vírgula).
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      # Primeiro modelo da lista = padrão do chat (o Pro do Gemini grátis não tem cota).
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-3.5-flash}
      # Ferramentas enviadas por chamada, escolhidas por relevância (0 = todas).
      TOOL_SELECT_MAX: ${TOOL_SELECT_MAX:-24}
      # Servidor local compatível com OpenAI (ex.: Ollama em CPU): http://host:11434/v1.
      # Vazio = desligado. Os modelos aparecem como "local:<nome>".
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      SEARCH_API_URL: ${SEARCH_API_URL:-}
      RESEARCH_API_URL: ${RESEARCH_API_URL:-}
      MCP_GROUP_INTELLIGENCE: ${MCP_GROUP_INTELLIGENCE:-true}
      MCP_GROUP_AGENTS: ${MCP_GROUP_AGENTS:-true}
      MCP_GROUP_MEMORY: ${MCP_GROUP_MEMORY:-true}
      MCP_GROUP_DEVTOOLS: ${MCP_GROUP_DEVTOOLS:-true}
      MCP_GROUP_SECURITY: ${MCP_GROUP_SECURITY:-false}
      MCP_GROUP_BROWSER: ${MCP_GROUP_BROWSER:-false}
      MCP_GROUP_NEURAL: ${MCP_GROUP_NEURAL:-false}
      MCP_GROUP_AGENTIC_FLOW: ${MCP_GROUP_AGENTIC_FLOW:-false}
      MCP_GROUP_CLAUDE_CODE: ${MCP_GROUP_CLAUDE_CODE:-false}
      MCP_GROUP_GEMINI: ${MCP_GROUP_GEMINI:-false}
      MCP_GROUP_CODEX: ${MCP_GROUP_CODEX:-false}
      # Só na rede interna da stack; o token é exigido em tudo menos /health.
      MCP_BIND_HOST: 0.0.0.0
      MCP_AUTH_TOKEN: ${SERVICE_PASSWORD_64_MCPTOKEN}
      # Terminal remoto desligado (executaria comandos no contêiner).
      MCP_ENABLE_TERMINAL: "false"
      MCP_CORS_ORIGIN: https://flow.n3xus.dev
      HOME: /tmp/home
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - mcp-state:/app/.claude-flow
    # +~300 MB do modelo de embedding da seleção de ferramentas (tool-select.js).
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  chat-ui:
    build:
      context: ./src/ruvocal
      dockerfile: Dockerfile
      args:
        INCLUDE_DB: "false"
    restart: unless-stopped
    environment:
      # Variável de ambiente vence o .env.local; o Coolify injeta as do recurso
      # em todos os serviços, então o token da ponte vai explícito aqui.
      OPENAI_API_KEY: ${SERVICE_PASSWORD_64_MCPTOKEN}
      OPENAI_BASE_URL: http://mcp-bridge:3001
      # O entrypoint grava DOTENV_LOCAL em /app/.env.local.
      DOTENV_LOCAL: |
        RVF_DB_PATH=/app/db
        PUBLIC_APP_NAME=N3XUS Flow
        PUBLIC_APP_DESCRIPTION=Orquestração de agentes de IA da N3XUS
        PUBLIC_APP_ASSETS=chatui
        PUBLIC_ORIGIN=https://flow.n3xus.dev
        LLM_SUMMARIZATION=true
        ENABLE_DATA_EXPORT=true
        ALLOW_IFRAME=false
        OPENAI_BASE_URL=http://mcp-bridge:3001
        OPENAI_API_KEY=${SERVICE_PASSWORD_64_MCPTOKEN}
        MCP_SERVERS=[{"name":"Core Tools","url":"http://mcp-bridge:3001/mcp/core","headers":{"Authorization":"Bearer ${SERVICE_PASSWORD_64_MCPTOKEN}"}},{"name":"Intelligence & Learning","url":"http://mcp-bridge:3001/mcp/intelligence","headers":{"Authorization":"Bearer ${SERVICE_PASSWORD_64_MCPTOKEN}"}},{"name":"Agents & Orchestration","url":"http://mcp-bridge:3001/mcp/agents","headers":{"Authorization":"Bearer ${SERVICE_PASSWORD_64_MCPTOKEN}"}},{"name":"Memory & Knowledge","url":"http://mcp-bridge:3001/mcp/memory","headers":{"Authorization":"Bearer ${SERVICE_PASSWORD_64_MCPTOKEN}"}},{"name":"Dev Tools & Analysis","url":"http://mcp-bridge:3001/mcp/devtools","headers":{"Authorization":"Bearer ${SERVICE_PASSWORD_64_MCPTOKEN}"}}]
        COOKIE_NAME=n3xus-flow
        COOKIE_SECURE=true
        COOKIE_SAMESITE=lax
        ADMIN_CLI_LOGIN=false
        ENABLE_CONFIG_MANAGER=false
    volumes:
      - chat-db:/app/db
    depends_on:
      - mcp-bridge
    mem_limit: 768m

  nginx:
    build:
      context: ./src/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_NGINX_3000
    depends_on:
      - chat-ui
      - mcp-bridge
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/chatui/icon.svg"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chat-db:
  mcp-state:
